# Ответ к СРОП 1: тесты на трёх версиях Python.
# Чтобы включить, замените им содержимое .github/workflows/tests.yml
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Запустить тесты
        run: pytest -q
